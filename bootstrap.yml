---
- name: Bootstrap repository access
  hosts: "{{ target_hosts | default('servers') }}"
  gather_facts: false
  become: false
  pre_tasks:
    - name: Install Python and Git if missing
      become: true
      ansible.builtin.raw: if ! command -v python >/dev/null || ! command -v git >/dev/null; then pacman
        -S --needed --noconfirm python git openssh; printf "BOOTSTRAP_INSTALLED\n"; fi
      register: bootstrap_packages
      changed_when: "'BOOTSTRAP_INSTALLED' in bootstrap_packages.stdout"
    - name: Gather target facts
      ansible.builtin.setup: {}
    - name: Require the intended unprivileged Arch Linux user
      ansible.builtin.assert:
        that:
          - "ansible_facts['os_family'] == 'Archlinux'"
          - "ansible_facts['user_id'] != 'root'"
          - "ansible_facts['user_id'] == target_user"
          - "expected_hostname is not defined or ansible_facts['hostname'] == expected_hostname"
        fail_msg: Select the intended Arch Linux host and connect as its regular user.
      tags:
        - always
  roles:
    - role: bootstrap
      tags:
        - bootstrap
