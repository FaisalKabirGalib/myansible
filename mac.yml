- name: Mac Setup
  hosts: localhost
  become: false # Homebrew refuses to run as root; nothing else here needs sudo
  environment:
    PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:{{ ansible_facts.ansible_env.PATH }}"
  vars:
    ssh_dir: "{{ lookup('env', 'HOME') }}/.ssh"
    source_key: "./ssh/id_rsa"
    dest_key: "{{ ssh_dir }}/id_rsa"
    server_key_source: "./ssh/server_key"
    server_key_dest: "{{ ssh_dir }}/server_key"
    pass_gpg_private_key: "./keys/pass_private.pgp"
    pass_gpg_public_key: "./keys/pass_public.pgp"
    # GUI apps to install via Homebrew Cask
    mac_casks:
      - ghostty
      - kitty
      - wezterm
      - visual-studio-code
      - obsidian
      - zen
      - orbstack
      - aerospace
      - raycast
      - font-caskaydia-mono-nerd-font
      - font-jetbrains-mono-nerd-font
      - font-maple-mono-nf
      - font-monaspace
  tasks:
    - include_tasks: tasks/macos_defaults.yml
      tags: [macos-defaults, install, terminal]
    - include_tasks: tasks/homebrew.yml
      tags: [homebrew, install]
    - include_tasks: tasks/git_setup.yml
      tags: [git-personal]
    - include_tasks: tasks/zsh.yml
      tags: [zsh, install, terminal]
    - include_tasks: tasks/zinit.yml
      tags: [zinit, zsh, install, terminal]
    - include_tasks: tasks/nvim.yml
      tags: [nvim, install, terminal]
    - include_tasks: tasks/tmux.yml
      tags: [tmux, install, terminal]
    - include_tasks: tasks/yazi.yml
      tags: [yazi, install, terminal]
    - include_tasks: tasks/cli_extras.yml
      tags: [cli-extras, install, terminal]
    - include_tasks: tasks/dev.yml
      tags: [dev, install, node]
    - include_tasks: tasks/flutter.yml
      tags: [flutter, dev, install]
    - include_tasks: tasks/dotfiles.yml
      tags: [dotfiles, install, terminal, nvim, tmux, yazi]
    - include_tasks: tasks/ai_cli.yml
      tags: [ai-cli, install]
    - include_tasks: tasks/casks.yml
      tags: [casks, install, terminal]
    - include_tasks: tasks/sketchybar.yml
      tags: [sketchybar, install, terminal]
    - include_tasks: tasks/ssh.yml
      tags: [ssh-only, ssh-full, never]
    - include_tasks: tasks/ssh_server_key.yml
      tags: [ssh-full, never]
    - include_tasks: tasks/pass.yml
      tags: [pass, never]
