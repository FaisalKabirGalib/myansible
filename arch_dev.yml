---
- name: Configure the Arch cloud development environment
  hosts: arch_dev
  gather_facts: true
  vars:
    cloud_home: '/home/galib'
    homelab_source: "{{ playbook_dir }}/../homelab"
    homelab_destination: "{{ cloud_home }}/homelab"
    homelab_key: "{{ cloud_home }}/.ssh/id_ed25519_homelab"
    homelab_key_title: 'arch-dev-homelab-readonly'
    cloud_backup: "{{ cloud_home }}/.local/state/arch-dev-env/pre-homelab"
    cloud_marker: "{{ cloud_home }}/.local/state/arch-dev-env/installed"
    cloud_dotfiles:
      - zsh
      - nvim
      - tmux
      - p10k
      - bin
      - opencode
      - claude-code
      - codex
    cloud_packages:
      - base-devel
      - git
      - github-cli
      - openssh
      - stow
      - rsync
      - zsh
      - zsh-completions
      - fzf
      - fd
      - eza
      - zoxide
      - bat
      - tmux
      - neovim
      - nodejs
      - npm
      - bun
      - nvm
      - luarocks
      - ripgrep
      - lazygit
      - lazydocker
      - tldr
      - go
      - python
      - uv
      - rust
      - mise
      - docker
      - docker-compose
      - docker-buildx
      - kubectl
      - helm
      - pass
      - gnupg
      - jq
      - curl
      - wget
      - unzip
      - zip
      - btop
      - htop
      - opencode
  tasks:
    - name: Require the intended cloud host and distribution
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'arch-dev'
          - ansible_facts['hostname'] == 'arch-dev'
          - ansible_facts['distribution'] == 'Archlinux'
        fail_msg: 'This playbook only configures the arch-dev Arch Linux VM.'
      tags: ['always']

    - name: Install development and dotfile dependencies
      become: true
      community.general.pacman:
        name: "{{ cloud_packages }}"
        state: present
      tags: ['packages', 'dev', 'zsh', 'nvim', 'tmux']

    - name: Install rsync on the Ansible controller
      delegate_to: localhost
      become: true
      ansible.builtin.package:
        name: rsync
        state: present
      tags: ['dotfiles']

    - name: Create user configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ cloud_home }}/.config"
        - "{{ cloud_home }}/.config/dotfiles"
        - "{{ cloud_home }}/.local/bin"
        - "{{ cloud_home }}/.local/state/arch-dev-env"
        - "{{ cloud_home }}/projects"
      tags: ['dotfiles']

    - name: Install coding assistant CLIs for the user
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: present
      environment:
        NPM_CONFIG_PREFIX: "{{ cloud_home }}/.local"
      loop:
        - '@openai/codex'
        - '@anthropic-ai/claude-code'
      tags: ['packages', 'dev']

    - name: Generate a machine-specific homelab deploy key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - '-q'
          - '-t'
          - ed25519
          - '-N'
          - ''
          - '-C'
          - "{{ homelab_key_title }}"
          - '-f'
          - "{{ homelab_key }}"
        creates: "{{ homelab_key }}"
      tags: ['dotfiles', 'git']

    - name: Inspect the Claude Code native launcher
      ansible.builtin.stat:
        path: "{{ cloud_home }}/.local/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
      register: claude_launcher
      tags: ['dev']

    - name: Finish Claude Code native binary installation
      ansible.builtin.command:
        argv: ['node', 'install.cjs']
        chdir: "{{ cloud_home }}/.local/lib/node_modules/@anthropic-ai/claude-code"
      when: claude_launcher.stat.exists and claude_launcher.stat.size < 4096
      changed_when: true
      tags: ['dev']

    - name: Verify installed coding assistant CLIs
      ansible.builtin.command:
        argv: ["{{ item }}", '--version']
      loop:
        - "{{ cloud_home }}/.local/bin/claude"
        - "{{ cloud_home }}/.local/bin/codex"
        - '/usr/bin/opencode'
      changed_when: false
      tags: ['dev']

    - name: Read the deploy public key
      ansible.builtin.slurp:
        src: "{{ homelab_key }}.pub"
      register: homelab_public_key
      tags: ['dotfiles', 'git']

    - name: Read registered homelab deploy keys
      ansible.builtin.command:
        argv: ['gh', 'api', 'repos/FaisalKabirGalib/homelab/keys']
      delegate_to: localhost
      register: homelab_registered_keys
      changed_when: false
      check_mode: false
      tags: ['dotfiles', 'git']

    - name: Register this VM's read-only homelab deploy key
      ansible.builtin.command:
        argv: ['gh', 'api', '--method', 'POST', 'repos/FaisalKabirGalib/homelab/keys', '--input', '-']
        stdin: >-
          {{ {'title': homelab_key_title, 'key': homelab_public_key.content | b64decode | trim,
          'read_only': true} | to_json }}
      delegate_to: localhost
      when: >-
        ((homelab_public_key.content | b64decode).split()[:2] | join(' ')) not in
        (homelab_registered_keys.stdout | from_json | map(attribute='key') | list)
      changed_when: true
      tags: ['dotfiles', 'git']

    - name: Read GitHub's published SSH host keys
      ansible.builtin.uri:
        url: 'https://api.github.com/meta'
        return_content: true
      delegate_to: localhost
      register: github_metadata
      check_mode: false
      tags: ['dotfiles', 'git']

    - name: Trust GitHub's published SSH host keys
      ansible.builtin.known_hosts:
        name: 'github.com'
        key: "github.com {{ item }}"
      loop: "{{ github_metadata.json.ssh_keys }}"
      tags: ['dotfiles', 'git']

    - name: Configure the homelab Git SSH alias
      ansible.builtin.blockinfile:
        path: "{{ cloud_home }}/.ssh/config"
        create: true
        mode: '0600'
        marker: '# {mark} ANSIBLE HOMELAB'
        block: |
          Host github-homelab
            HostName github.com
            User git
            IdentityFile {{ homelab_key }}
            IdentitiesOnly yes
      tags: ['dotfiles', 'git']

    - name: Clone the homelab repository without overwriting local changes
      ansible.builtin.git:
        repo: 'git@github-homelab:FaisalKabirGalib/homelab.git'
        dest: "{{ homelab_destination }}"
        version: 'main'
        key_file: "{{ homelab_key }}"
        update: false
      register: homelab_clone
      retries: 4
      delay: 5
      until: homelab_clone is succeeded
      tags: ['dotfiles', 'git']

    - name: Sync the controller's current dotfile packages
      ansible.posix.synchronize:
        src: "{{ homelab_source }}/{{ item }}/"
        dest: "{{ homelab_destination }}/{{ item }}/"
        archive: true
        delete: true
        rsync_opts:
          - '--exclude=secrets.zsh'
          - '--exclude=.env'
          - '--exclude=.credentials.json'
          - '--exclude=auth.json'
          - '--exclude=.git/'
          - '--exclude=/.tmux/plugins/'
          - '--exclude=/.config/tmux/plugins/'
      loop: "{{ cloud_dotfiles }}"
      register: cloud_dotfiles_sync
      tags: ['dotfiles']

    - name: Select this machine's dotfile packages
      ansible.builtin.copy:
        content: "{{ cloud_dotfiles | join('\n') }}\n"
        dest: "{{ cloud_home }}/.config/dotfiles/packages"
        mode: '0644'
      tags: ['dotfiles']

    - name: Check whether the cloud profile is already installed
      ansible.builtin.stat:
        path: "{{ cloud_marker }}"
      register: cloud_profile_installed
      tags: ['dotfiles']

    - name: Back up the initial shell and editor configuration
      ansible.builtin.shell: |
        set -eu
        for item in .zshrc .p10k.zsh .tmux.conf .config/nvim .config/tmux; do
          source="$HOME/$item"
          destination="{{ cloud_backup }}/$item"
          if { [ -e "$source" ] || [ -L "$source" ]; } && [ ! -e "$destination" ] && [ ! -L "$destination" ]; then
            mkdir -p "$(dirname "$destination")"
            mv "$source" "$destination"
          fi
        done
      args:
        executable: '/bin/bash'
      when: not cloud_profile_installed.stat.exists
      changed_when: true
      tags: ['dotfiles']

    - name: Preview dotfile links
      ansible.builtin.command:
        argv: >-
          {{ ['stow', '--simulate', '--verbose=1', '--no-folding', '-S', '-t', cloud_home]
          + cloud_dotfiles }}
        chdir: "{{ homelab_destination }}"
      register: stow_preview
      changed_when: false
      check_mode: false
      tags: ['dotfiles']

    - name: Link the cloud dotfile profile
      ansible.builtin.command:
        argv: "{{ ['stow', '--no-folding', '-R', '-t', cloud_home] + cloud_dotfiles }}"
        chdir: "{{ homelab_destination }}"
      when: >-
        cloud_dotfiles_sync.changed or 'LINK:' in stow_preview.stderr or 'UNLINK:' in stow_preview.stderr or
        'MKDIR:' in stow_preview.stderr or 'RMDIR:' in stow_preview.stderr
      changed_when: true
      tags: ['dotfiles']

    - name: Record the installed profile
      ansible.builtin.copy:
        dest: "{{ cloud_marker }}"
        content: 'Managed by myansible/arch_dev.yml using homelab dotfiles.\n'
        mode: '0644'
      tags: ['dotfiles']

    - name: Configure Git identity
      community.general.git_config:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        scope: global
      loop:
        - {name: 'user.name', value: 'Faisal Kabir Galib'}
        - {name: 'user.email', value: 'faisalkabirgalib@gmail.com'}
      tags: ['git-personal', 'git']

    - name: Clone Zinit
      ansible.builtin.git:
        repo: 'https://github.com/zdharma-continuum/zinit.git'
        dest: "{{ cloud_home }}/.local/share/zinit/zinit.git"
        update: false
      tags: ['zsh']

    - name: Create the NVM user directory
      ansible.builtin.file:
        path: "{{ cloud_home }}/.config/nvm/alias"
        state: directory
        mode: '0755'
      tags: ['zsh', 'dev']

    - name: Link the packaged NVM scripts at the configured paths
      ansible.builtin.file:
        src: "/usr/share/nvm/{{ item }}"
        dest: "{{ cloud_home }}/.config/nvm/{{ item }}"
        state: link
      loop: ['nvm.sh', 'nvm-exec', 'bash_completion']
      tags: ['zsh', 'dev']

    - name: Use the system Node installation by default
      ansible.builtin.copy:
        content: "system\n"
        dest: "{{ cloud_home }}/.config/nvm/alias/default"
        mode: '0644'
        force: false
      tags: ['zsh', 'dev']

    - name: Clone the tmux plugin manager
      ansible.builtin.git:
        repo: 'https://github.com/tmux-plugins/tpm.git'
        dest: "{{ cloud_home }}/.config/tmux/plugins/tpm"
        update: false
      tags: ['tmux']

    - name: Use Zsh as the login shell
      become: true
      ansible.builtin.user:
        name: galib
        shell: '/usr/bin/zsh'
      tags: ['zsh']

    - name: Create the legacy tmux configuration directory
      ansible.builtin.file:
        path: "{{ cloud_home }}/.tmux"
        state: directory
        mode: '0755'
      tags: ['tmux']

    - name: Share tmux plugins with the legacy configuration
      ansible.builtin.file:
        src: "{{ cloud_home }}/.config/tmux/plugins"
        dest: "{{ cloud_home }}/.tmux/plugins"
        state: link
      tags: ['tmux']

    - name: Enable Docker for development
      become: true
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
      tags: ['dev']
