- name: Install stow via Homebrew
  community.general.homebrew:
    name: stow
    state: present
  tags:
    - dotfiles
    - install

- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "https://github.com/FaisalKabirGalib/dotfiles.git"
    dest: "{{ lookup('env','HOME') }}/dotfiles"
    version: mac-mini-m2 # macOS-adapted branch of `omarchy`; Wayland-only packages removed, vscode/ghostty/kitty paths fixed for macOS
  tags:
    - dotfiles

- name: Stow dotfile packages
  ansible.builtin.shell: |
    cd "{{ lookup('env','HOME') }}/dotfiles" && ./stowup
  # No explicit package list needed: mac-mini-m2 only contains mac-safe packages.
  tags:
    - dotfiles

- name: Install tmux plugins via TPM
  ansible.builtin.command:
    cmd: "{{ lookup('env','HOME') }}/.config/tmux/plugins/tpm/bin/install_plugins"
  # TPM's install script reads ~/.config/tmux/tmux.conf directly and doesn't need
  # a running tmux server, but the conf only exists once dotfiles are stowed above.
  changed_when: true
  tags:
    - dotfiles
    - tmux

- name: Bootstrap Neovim plugins headlessly (Lazy.nvim sync)
  ansible.builtin.command:
    cmd: nvim --headless "+Lazy! sync" +qa
  changed_when: true
  # nvim/install-plugins.sh is interactive (waits on `read` then opens a foreground
  # TUI) and would hang Ansible forever; this is the headless equivalent.
  tags:
    - dotfiles
    - nvim

- name: Check whether Lazy.nvim's sync modified the stowed lazy-lock.json
  ansible.builtin.command:
    cmd: git diff --quiet -- nvim/.config/nvim/lazy-lock.json
  args:
    chdir: "{{ lookup('env','HOME') }}/dotfiles"
  register: lazy_lock_diff
  failed_when: false
  changed_when: false
  tags:
    - dotfiles
    - nvim

- name: Commit the updated lazy-lock.json (local only, not pushed)
  ansible.builtin.command:
    cmd: git commit -m "Update lazy-lock.json (automated, via mac.yml headless sync)" -- nvim/.config/nvim/lazy-lock.json
  args:
    chdir: "{{ lookup('env','HOME') }}/dotfiles"
  # lazy-lock.json is symlinked back into the git repo via stow, so the
  # headless sync above writes straight through it -- without committing
  # that drift, the *next* run's git-clone task would refuse to update
  # ("local modifications exist") and the playbook would fail every time.
  # Committed locally only; push it yourself whenever you're pushing other
  # dotfiles changes.
  when: lazy_lock_diff.rc == 1
  changed_when: true
  tags:
    - dotfiles
    - nvim
