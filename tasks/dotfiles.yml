- name: Install packages
  package:
    name:
      - stow
    state: present
  tags:
    - dotfiles
    - install

- name: Clone dotfiles repository
  git:
    repo: "https://github.com/FaisalKabirGalib/dotfiles.git" # Replace with your repository URL
    dest: "/home/{{ username }}/dotfiles"
    version: server # You can specify a branch, tag, or commit here
  tags:
    - dotfiles

- name: Stow dotfiles
  shell: |
    cd "/home/{{ username }}/dotfiles" && ./stowup
  args:
    creates: "/home/{{ username }}/.zshrc"  # Prevents running if dotfiles are already stowed
  tags:
    - dotfiles
