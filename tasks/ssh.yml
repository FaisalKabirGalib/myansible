- name: Ensure .ssh directory exists
  ansible.builtin.file:
    dest: "{{ dest_key | dirname }}"
    mode: "0700"
    state: directory
  tags:
    - ssh
    - install

- name: Install ssh key
  ansible.builtin.copy:
    src: "{{ source_key }}"
    dest: "{{ dest_key }}"
    mode: "0600"
  tags:
    - ssh
    - install

- name: Install ssh key public
  ansible.builtin.copy:
    src: "{{ source_key }}.pub"
    dest: "{{ dest_key }}.pub"
    mode: "0644"
  tags:
    - ssh
    - install

- name: Add ssh key to macOS Keychain
  ansible.builtin.shell: ssh-add --apple-use-keychain "{{ dest_key }}"
  tags:
    - ssh
    - install
