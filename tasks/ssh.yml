- name: Install OpenSSH tools
  package:
    name: openssh
    state: present

- name: Install python-pexpect for SSH automation
  package:
    name: python-pexpect
    state: present
  tags:
    - ssh
    - install

- name: Ensure .ssh directory exists
  file:
    dest: "{{ dest_key | dirname }}"
    mode: 0700
    state: directory
  tags:
    - ssh
    - install

- name: Install ssh key
  copy:
    src: "{{ source_key }}"
    dest: "{{ dest_key }}"
    mode: 0600
  tags:
    - ssh
    - Install

- name: Install ssh key public
  copy:
    src: "{{ source_key }}.pub"
    dest: "{{ dest_key }}.pub"
    mode: 0644
  tags:
    - ssh
    - install

- name: Load vaulted SSH secrets
  include_vars: vars/secrets.yml
  no_log: true
  when: ssh_passphrase is defined

- name: Start SSH agent and add key with passphrase
  expect:
    command: |
      eval "$(ssh-agent -s)"
      ssh-add ~/.ssh/id_rsa
    responses:
      "Enter passphrase": "{{ ssh_passphrase }}"
      "Agent pid": "Agent started"
    echo: yes
  no_log: true
  when: ssh_passphrase is defined and ssh_passphrase != ""
  register: ssh_add_result
  failed_when: ssh_add_result.rc != 0 and "already added" not in ssh_add_result.stderr
  tags:
    - ssh
    - install
