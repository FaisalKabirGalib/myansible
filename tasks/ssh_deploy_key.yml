- name: Ensure .ssh directory exists
  file:
    dest: "{{ lookup('env', 'HOME') }}/.ssh"
    mode: '0700'
    state: directory
  tags:
    - ssh
    - deploy-key

- name: Add GitHub Actions deploy key to authorized_keys
  lineinfile:
    dest: "{{ lookup('env', 'HOME') }}/.ssh/authorized_keys"
    line: "{{ lookup('file', 'git_keys/git_deploy.pub') }}"
    state: present
    create: true
    mode: '0600'
  tags:
    - ssh
    - deploy-key
