- name: Install zsh and tools for Ubuntu
  ansible.builtin.apt:
    name:
      - zsh
      - fzf
      - fd-find
      - eza
      - zoxide
      - bat
    state: present
    update_cache: yes
  tags: zsh

- name: Create fd symlink for Ubuntu (fd-find -> fd)
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  tags: zsh
