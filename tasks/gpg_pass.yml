---
- name: Ensure .gnupg directory exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.gnupg"
    state: directory
    mode: '0700'

- name: GPG key import with vault decryption
  block:
    - name: Decrypt and copy GPG private key to temporary location
      copy:
        content: "{{ lookup('ansible.builtin.unvault', playbook_dir + '/keys/pass_private.pgp') }}"
        dest: "/tmp/gpg_import_{{ ansible_facts['date_time']['iso8601_basic_short'] }}.pgp"
        mode: '0600'
      register: temp_key
      no_log: true

    - name: Import GPG private key
      shell: |
        gpg --batch --import "{{ temp_key.dest }}"
      register: gpg_import
      changed_when: "'imported' in gpg_import.stderr or 'unchanged' in gpg_import.stderr"

    - name: Display import result
      debug:
        msg: "GPG key import: {{ 'New key imported' if 'imported' in gpg_import.stderr else 'Key already exists (unchanged)' }}"
      when: gpg_import is defined

  rescue:
    - name: Warn about GPG import failure
      debug:
        msg: "WARNING: GPG key import failed. This is likely due to vault password issue. Skipping GPG/pass setup."

  always:
    - name: Securely remove temporary key file
      file:
        path: "{{ temp_key.dest }}"
        state: absent
      become: true
      when: temp_key is defined and temp_key.dest is defined

- name: Import GPG public key
  shell: |
    gpg --batch --import {{ playbook_dir }}/keys/pass_public.pgp
  register: gpg_public_import
  changed_when: "'imported' in gpg_public_import.stderr"

- name: Get GPG key ID
  shell: |
    set -o pipefail
    gpg --list-keys --with-colons | grep '^pub:' | cut -d':' -f5
  register: gpg_key_id
  changed_when: false
  failed_when: false

- name: Set GPG key trust to ultimate
  shell: |
    echo "{{ gpg_key_id.stdout }}:6:" | gpg --import-ownertrust
  when: gpg_key_id.stdout is defined and gpg_key_id.stdout | length > 0
  register: gpg_trust_set
  changed_when: gpg_trust_set.rc == 0
  failed_when: false

- name: Verify GPG key trust level
  shell: |
    set -o pipefail
    gpg --list-keys --with-colons | grep '^pub:' | cut -d':' -f9
  register: gpg_trust_level
  changed_when: false
  failed_when: false

- name: Display GPG trust verification
  debug:
    msg: "GPG key trust level: {{ gpg_trust_level.stdout }} (should be 'u' for ultimate)"

- name: Install pass password manager (Arch)
  pacman:
    name: pass
    state: present
  when: ansible_facts['os_family'] == "Archlinux"
  become: true

- name: Install pass password manager (Ubuntu/Debian)
  apt:
    name: pass
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
  become: true

- name: Clone password repository
  git:
    repo: https://github.com/FaisalKabirGalib/mypass.git
    dest: "{{ lookup('env', 'HOME') }}/.password-store"
    version: main
    update: false
    accept_hostkey: true
  become: false

- name: Initialize pass with the GPG key ID
  shell: |
    pass init {{ gpg_key_id.stdout }}
  args:
    creates: "{{ lookup('env', 'HOME') }}/.password-store/.gpg-id"
  when: gpg_key_id.stdout is defined and gpg_key_id.stdout | length > 0
  become: false

- name: Verify pass setup
  command: pass ls
  register: pass_list
  changed_when: false
  become: false

- name: Display password store contents
  debug:
    msg: "Password store contents: {{ pass_list.stdout_lines }}"
  when: pass_list.stdout_lines is defined and pass_list.stdout_lines | length > 0
  become: false
