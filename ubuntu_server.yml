- name: Ubuntu Server Setup
  hosts: localhost
  become: true
  vars:
    username: galib
    source_key: "./ssh/id_rsa"
    dest_key: "/home/{{ username }}/.ssh/id_rsa"

  tasks:
    - include_tasks: tasks/ubuntu/user.yml
    - include_tasks: tasks/git_setup.yml
    - include_tasks: tasks/dotfiles.yml
    - include_tasks: tasks/ubuntu/ssh.yml
    - include_tasks: tasks/ubuntu/zsh.yml
    - include_tasks: tasks/ubuntu/nvim.yml
    - include_tasks: tasks/tmux.yml
